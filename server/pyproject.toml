[project]
name = "shoppingbuddy-server"
version = "0.1.0"
description = "Personal product rating database with offline-first sync"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "alembic>=1.13",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.web"]

[tool.setuptools.package-data]
"app" = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]
"app.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
