{% extends "base.html" %}
{% block title %}Log in · shoppingBuddy{% endblock %}
{% block content %}
<form class="card narrow" method="post" action="/login">
  <h1>Log in</h1>
  {% if error %}<div class="errors" role="alert">{{ error }}</div>{% endif %}
  <input type="hidden" name="next" value="{{ next }}">
  <label>API token
    <input type="password" name="token" required autofocus autocomplete="current-password">
  </label>
  <div class="actions"><button type="submit">Log in</button></div>
</form>
{% endblock %}
