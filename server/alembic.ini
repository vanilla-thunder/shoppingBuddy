# Command-line use, run from the server/ directory:
#   alembic upgrade head
#   alembic revision --autogenerate -m "describe the change"
# The database URL comes from SB_DATABASE_URL (or .env), like the app itself.
# The app also upgrades to head on every start, so running this by hand is optional.

[alembic]
script_location = %(here)s/app/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
